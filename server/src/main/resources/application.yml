server:
  port: 8080

app:
  models:
    # Base64 of 32 bytes; encrypts user-supplied provider API keys (ADR-0010).
    secret-key: ${MODEL_SECRET_KEY:}
    allow-system-default: ${ALLOW_SYSTEM_DEFAULT_MODEL:true}
  # Knowledge base / RAG (FR-2). User settings override embedding/rerank;
  # deployment values below are the fallback.
  kb:
    enabled: ${KB_ENABLED:true}
    allow-private-endpoints: ${KB_ALLOW_PRIVATE_ENDPOINTS:false}
    max-documents-per-user: ${KB_MAX_DOCUMENTS_PER_USER:200}
    max-bytes-per-user: ${KB_MAX_BYTES_PER_USER:1073741824}
    worker-threads: ${KB_WORKER_THREADS:3}
    queue:
      prefix: ${KB_QUEUE_PREFIX:kb}
    qdrant:
      url: ${QDRANT_URL:http://localhost:6333}
      api-key: ${QDRANT_API_KEY:}
      collection-prefix: ${QDRANT_COLLECTION_PREFIX:kb_passages}
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      # Credentials come from the environment only; blank means not configured.
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      bucket: ${S3_BUCKET:agent-core-kb}
      region: ${S3_REGION:us-east-1}
      path-style: ${S3_PATH_STYLE:true}
    embedding:
      base-url: ${EMBEDDING_BASE_URL:}
      api-key: ${EMBEDDING_API_KEY:}
      model: ${EMBEDDING_MODEL:BAAI/bge-m3}
      dim: ${EMBEDDING_DIM:1024}
      batch-size: ${EMBEDDING_BATCH_SIZE:32}
      path: ${EMBEDDING_PATH:/embeddings}
    rerank:
      enabled: ${RERANK_ENABLED:true}
      base-url: ${RERANK_BASE_URL:}
      api-key: ${RERANK_API_KEY:}
      model: ${RERANK_MODEL:BAAI/bge-reranker-v2-m3}
      path: ${RERANK_PATH:/rerank}
      candidates: ${RERANK_CANDIDATES:10}
      top-n: ${RERANK_TOP_N:5}
    # Scanned-PDF OCR sidecar (ADR-0014). Off by default; see ocr/README.md.
    ocr:
      enabled: ${KB_OCR_ENABLED:false}
      base-url: ${KB_OCR_BASE_URL:}
      token: ${KB_OCR_TOKEN:}
      max-pages: ${KB_OCR_MAX_PAGES:100}
      timeout-ms: ${KB_OCR_TIMEOUT_MS:20000}
      total-budget-ms: ${KB_OCR_TOTAL_BUDGET_MS:480000}
      min-text-chars: ${KB_OCR_MIN_TEXT_CHARS:10}
      dpi: ${KB_OCR_DPI:200}
  # Fixed-window rate limits (FR-6). `enabled=false` is the incident switch.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    user-rpm: ${RATE_LIMIT_USER_RPM:120}
    user-tpm: ${RATE_LIMIT_USER_TPM:100000}
    auth-ip-rpm: ${RATE_LIMIT_AUTH_IP_RPM:10}
    window: ${RATE_LIMIT_WINDOW:60s}
  profile:
    max-facts: ${PROFILE_MAX_FACTS:20}
    max-chars: ${PROFILE_MAX_CHARS:4000}
  message-cache:
    ttl: 24h
    max-entries: 100
  auth:
    # HS256 key; startup fails when unset or shorter than 32 bytes (ADR-0007).
    jwt-secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 7d
    # Enable behind HTTPS in production; local dev uses plain http.
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  gateway:
    base-url: ${GATEWAY_URL:http://localhost:3001}
    # Shared token; must match the gateway's GATEWAY_API_TOKEN when set.
    api-token: ${GATEWAY_API_TOKEN:}
  # run_code executor (FR-3). The image must exist on the Docker host;
  # the server never builds or pulls it at runtime.
  sandbox:
    docker-host: ${SANDBOX_DOCKER_HOST:}
    image: ${SANDBOX_IMAGE:agent-core-sandbox:python-3.12}
    default-timeout: ${SANDBOX_DEFAULT_TIMEOUT:30s}
    max-timeout: ${SANDBOX_MAX_TIMEOUT:60s}
    code-max-bytes: ${SANDBOX_CODE_MAX_BYTES:262144}
    output-max-bytes: ${SANDBOX_OUTPUT_MAX_BYTES:65536}
    chunk-max-bytes: ${SANDBOX_CHUNK_MAX_BYTES:2048}
    global-concurrency: ${SANDBOX_GLOBAL_CONCURRENCY:8}
    per-user-concurrency: ${SANDBOX_PER_USER_CONCURRENCY:2}
    queue-timeout: ${SANDBOX_QUEUE_TIMEOUT:120s}
    permit-lease: ${SANDBOX_PERMIT_LEASE:240s}
    retention-days: ${SANDBOX_RETENTION_DAYS:90}

# Rate-limit metrics live on a separate management port; do not expose other
# actuator endpoints there.
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: prometheus

# Local defaults match docker-compose.yml. Flyway owns the schema; the app
# connects at boot and never generates DDL from entities (ADR-0009).
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/agent_core?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USER:agent_core}
    password: ${MYSQL_PASSWORD:agent_core}
  servlet:
    multipart:
      # A single original is capped at 20 MB (FR-2); request headroom is for the form part.
      max-file-size: 20MB
      max-request-size: 21MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # A broker outage must not block startup; publishers declare topology lazily.
    connection-timeout: 3s
    publisher-confirm-type: correlated
    listener:
      simple:
        auto-startup: ${KB_ENABLED:true}
        acknowledge-mode: manual
        prefetch: 1
        concurrency: ${KB_WORKER_THREADS:3}
        max-concurrency: ${KB_WORKER_THREADS:3}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
