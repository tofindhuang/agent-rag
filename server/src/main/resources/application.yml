server:
  port: 8080

app:
  gateway:
    base-url: ${GATEWAY_URL:http://localhost:3001}
    # Shared token; must match the gateway's GATEWAY_API_TOKEN when set.
    api-token: ${GATEWAY_API_TOKEN:}

# Local defaults match docker-compose.yml. Flyway owns the schema; the app
# connects at boot and never generates DDL from entities (ADR-0009).
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/agent_core?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USER:agent_core}
    password: ${MYSQL_PASSWORD:agent_core}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
