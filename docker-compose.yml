# Local development stack only. Default credentials below are not for production.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: agent_core
      MYSQL_USER: agent_core
      MYSQL_PASSWORD: agent_core
      MYSQL_ROOT_PASSWORD: root-dev-only
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Vector store for KB passages (ADR-0005). REST on :6333.
  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # Qdrant's image has bash but no curl/wget; a TCP connect is enough here.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Ingestion work queue (FR-2). Management UI on :15672.
  rabbitmq:
    image: rabbitmq:4.3.7-management
    environment:
      RABBITMQ_DEFAULT_USER: agent_core
      RABBITMQ_DEFAULT_PASS: agent_core_dev_only
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # RapidOCR sidecar for scanned PDFs (ADR-0014). Opt-in profile so the default
  # dev stack stays light: `docker compose --profile ocr up -d`.
  ocr:
    profiles: ["ocr"]
    build: ./ocr
    ports:
      - "8000:8000"
    environment:
      OCR_API_TOKEN: ${OCR_API_TOKEN:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # S3-compatible originals store (ADR-0013). Silo is the community-maintained
  # MinIO fork; the server talks to it through the standard S3 API.
  silo:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: agent_core
      MINIO_ROOT_PASSWORD: agent_core_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - silo-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  mysql-data:
  qdrant-data:
  rabbitmq-data:
  silo-data:
