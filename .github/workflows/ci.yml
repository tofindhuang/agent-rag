name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  contract:
    name: Contract fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate contract fixtures
        run: node contract/v1/validate.mjs

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # pi 1.1.0 imports node:fs globSync (Node 22+).
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Install
        working-directory: gateway
        run: npm ci
      - name: Typecheck
        working-directory: gateway
        run: npm run typecheck
      - name: Test
        working-directory: gateway
        run: npm test

  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Verify
        working-directory: server
        run: mvn -B verify

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build

  sandbox:
    name: Sandbox isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run isolation checks
        run: bash sandbox/test-isolation.sh
